# CPC 464 with VDOS and a CP/M disk in A:, without analysis (full speed).
# Start: cpcxray gui --config config/cpm_vdos.toml
# Same ROMs as machine.toml; VDOS is still decoded (decode = true), but not analysed.

[machine]
model = "464"
unpopulated_rom = 0

[rom.lower]
file = "roms/os464.rom"

[rom.upper.0]
file = "roms/basic10.rom"

[rom.upper.5]
file = "roms/vdos211x.rom"   # VDOS 2.11X (raw, scrambled dump)
decoder = "vortex"
decode = true
analyse = false              # no analysis observers: about 2x faster

[rom.upper.7]
file = "roms/amsdos.rom"

# Both drives writable: the CPC may write to the disks. Changes stay in memory; they reach a
# file only with disk_save / "Save as" in the Disks tab (choose a new name to keep the original).
[drive.A]                    # 3" drive
file = "disk/464_cpm_22_vdos.dsk"
writable = true

[drive.B]                    # Vortex drive (80 tracks, 2 sides)
file = "disk/Vortex_init.dsk"
writable = true
