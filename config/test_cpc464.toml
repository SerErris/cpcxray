# Test configuration of the emulator's test suite: CPC 464 with OS, BASIC 1.0 and AMSDOS.
# The standard ROMs come from the package (src/cpcxray/roms/, in git: the tests find them in CI
# too). No drives: tests insert the disk images they need (tests/machines.py).

[machine]
model = "464"
unpopulated_rom = 0          # D-10

[rom.lower]
file = "src/cpcxray/roms/os464.rom"

[rom.upper.0]
file = "src/cpcxray/roms/basic10.rom"

[rom.upper.7]
file = "src/cpcxray/roms/amsdos.rom"
