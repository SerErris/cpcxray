# CPC 664: a 464 with a built-in 3" disc drive and firmware V1.1 - the same 64 KB architecture,
# no RAM banking (and no cassette, which cpcxray does not model anyway).
# Start: cpcxray gui --config config/cpc664.toml
# The 664 has its own OS ROM and BASIC 1.1 (as the 6128); AMSDOS is the same as on the 464.
# The ROM files are not in git (NFR-07): put them into roms/ under these names.

[machine]
model = "664"
unpopulated_rom = 0          # D-10

[rom.lower]
file = "roms/os664.rom"

# Upper ROM slots 0-15 (D-09)
[rom.upper.0]
file = "roms/basic11_664.rom"

[rom.upper.7]
file = "roms/amsdos.rom"

# Disk image inserted at power-on; read-only unless writable = true. A: the built-in 3" drive.
[drive.A]
file = "disk/464_cpm_22_orig.dsk"
