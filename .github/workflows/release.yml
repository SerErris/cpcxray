# A release: on a tag vX.Y.Z build the wheel and sdist, the ready-made apps for Linux and
# Windows (PyInstaller), and publish them as a GitHub Release. Each app archive is a project
# folder: the program plus what `cpcxray init` creates (configs, the standard ROMs, ...).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build --outdir dist
      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install "$(ls dist/*.whl)[gui,mcp]"
          /tmp/check/bin/cpcxray --version
          /tmp/check/bin/cpcxray init /tmp/project
          /tmp/check/bin/cpcxray config --config /tmp/project/config/machine.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*

  app:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04  # an older glibc: the app runs on more Linux systems
            archive: linux-x86_64.tar.gz
          - os: windows-latest
            archive: windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the app
        run: |
          pip install ".[gui,mcp]" pyinstaller
          pyinstaller packaging/cpcxray.spec --noconfirm --distpath dist --workpath build
      - name: Make it a project folder and smoke test it
        working-directory: dist/cpcxray
        run: |
          ./cpcxray --version
          ./cpcxray init
          ./cpcxray config
      - name: Archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="cpcxray-${version}-${{ matrix.archive }}"
          cd dist
          if [[ "${{ matrix.archive }}" == *.zip ]]; then
            7z a "../${name}" cpcxray
          else
            tar czf "../${name}" cpcxray
          fi
          echo "ARCHIVE=${name}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: ${{ env.ARCHIVE }}

  publish:
    needs: [wheel, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # CHANGELOG.md: the release notes
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # the section "## <version> ..." up to the next "## "
          awk -v version="$version" '
            /^## / { if (found) exit; if (index($0, "## " version " ") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG.md section for $version"; exit 1; }
          cat >> notes.md <<NOTES

          **Downloads**
          - \`cpcxray-${version}-py3-none-any.whl\` - the Python package, for Python 3.12 or newer:
            \`pipx install "cpcxray[gui,mcp] @ https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/cpcxray-${version}-py3-none-any.whl"\`
          - \`cpcxray-${version}-linux-x86_64.tar.gz\`, \`cpcxray-${version}-windows-x86_64.zip\` - ready-made
            programs, no Python needed: unpack and run \`cpcxray\` (\`cpcxray.exe\`); the folder is a project
            folder already.
          - \`sjasmplus\` on the PATH is needed only for the round-trip check of generated sources.

          See the [install guide](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/install.md).
          NOTES
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "$GITHUB_REF_NAME" == v0.* ]] && prerelease="--prerelease"  # 0.x: beta
          gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" \
            --title "cpcxray ${GITHUB_REF_NAME#v}" --notes-file notes.md $prerelease
