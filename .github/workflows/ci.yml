# Checks on every push and pull request: lint, format, pylint and the test suite.
# Tests that need a display (the GUI window) or local files (other ROMs, disk images) skip.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sjasmplus (the round-trip check, D-33)
        run: |
          git clone --depth 1 --branch v1.23.0 --recurse-submodules --shallow-submodules \
            https://github.com/z00m128/sjasmplus.git /tmp/sjasmplus
          make -C /tmp/sjasmplus -j4
          sudo make -C /tmp/sjasmplus install
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check
          ruff format --check
          pylint src tests tools
      - name: Tests
        run: pytest
